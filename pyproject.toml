[project]
name = "ragsearch"
version = "0.1.0"
description = "Semantic search and RAG system built from scratch"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pypdf", "faiss-cpu", "httpx", "requests", "trafilatura",
    "fastapi", "uvicorn", "pydantic>=2",
]

[project.optional-dependencies]
# ruff is pinned so local runs and CI apply exactly the same lint rules.
dev = ["pytest>=8", "ruff==0.17.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: talks to a real service (Ollama or the internet); skipped unless RAGSEARCH_LIVE=1",
]
