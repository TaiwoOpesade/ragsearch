[project]
name = "ragsearch"
version = "0.1.0"
description = "Semantic search and RAG system built from scratch"
requires-python = ">=3.10"
dependencies = ["numpy", "pypdf", "faiss-cpu"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: talks to a real service (Ollama or the internet); skipped unless RAGSEARCH_LIVE=1",
]
